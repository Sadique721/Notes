<div class="min-h-screen bg-[#0b0c10] text-[#c5c6c7] font-sans pb-16">
  <!-- Top Navigation Header -->
  <header class="h-16 border-b border-white/10 px-8 flex items-center justify-between bg-black/60 backdrop-blur-md">
    <div class="flex items-center gap-4">
      <a routerLink="/" class="text-xs font-bold tracking-widest text-[#10E39B] uppercase hover:underline">
        &larr; Admin Panel
      </a>
      <span class="text-white/20">|</span>
      <h1 class="text-sm font-bold tracking-wider text-white uppercase">Curriculum Modules</h1>
    </div>
  </header>

  <!-- Main Content Container -->
  <div class="max-w-7xl mx-auto px-8 mt-12 space-y-12">
    <div>
      <h2 class="text-3xl font-extrabold text-white tracking-tight">Unlocking System Constellations</h2>
      <p class="text-sm text-white/50 mt-2 max-w-xl leading-relaxed">
        Select a module to browse its corresponding hardware and API integration topics.
      </p>
    </div>

    <!-- Modules Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div 
        *ngFor="let mod of modulesList"
        class="border border-white/5 bg-white/3 hover:bg-white/5 hover:border-white/15 p-6 rounded-2xl transition-all duration-300 flex flex-col justify-between group"
      >
        <div>
          <!-- Module Accent Badge -->
          <div class="flex items-center justify-between mb-4">
            <span class="text-[10px] font-mono font-bold uppercase tracking-widest px-2 py-0.5 rounded-full"
              [style.color]="getModuleColor(mod.slug)"
              [style.borderColor]="getModuleColor(mod.slug) + '25'"
              [style.backgroundColor]="getModuleColor(mod.slug) + '10'"
              class="border text-[10px] font-mono font-bold uppercase tracking-wider px-2 py-0.5 rounded"
            >
              Module {{ mod.order }}
            </span>
            <span class="text-xs text-white/40 font-mono">{{ mod.topics.length }} Topics</span>
          </div>

          <!-- Module Title -->
          <h3 class="text-xl font-bold text-white group-hover:text-white transition-colors">
            {{ mod.title }}
          </h3>

          <!-- Topics List Preview -->
          <ul class="mt-4 space-y-2 border-t border-white/5 pt-4">
            <li 
              *ngFor="let t of mod.topics"
              class="text-xs text-white/50 hover:text-white transition-colors flex items-center gap-2"
            >
              <span class="w-1.5 h-1.5 rounded-full" [style.backgroundColor]="getModuleColor(mod.slug)"></span>
              <a [routerLink]="['/topic', t.slug]" class="hover:underline">{{ t.title }}</a>
            </li>
          </ul>
        </div>

        <!-- Action Button -->
        <div class="mt-6 pt-4 border-t border-white/5 flex items-center justify-between">
          <span class="text-xs font-semibold text-white/40 group-hover:text-white transition-colors">
            Explore Module
          </span>
          <svg class="w-4 h-4 text-white/40 group-hover:translate-x-1 group-hover:text-white transition-all" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>
    </div>
  </div>
</div>
