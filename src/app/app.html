<router-outlet></router-outlet>

<!-- Global Sliding Curriculum Drawer -->
<div class="fixed inset-0 z-50 flex overflow-hidden" *ngIf="navService.curriculumOpen()">
  
  <!-- Backdrop Overlay -->
  <div 
    (click)="navService.closeCurriculum()" 
    class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-300"
  ></div>

  <!-- Drawer Panel Content Container -->
  <aside 
    class="relative w-80 max-w-sm h-full bg-[#0b0c10] border-r border-white/10 flex flex-col z-50 text-[#c5c6c7] shadow-2xl transition-transform duration-300"
  >
    
    <!-- Drawer Title Header -->
    <div class="p-5 border-b border-white/10 flex items-center justify-between bg-black/40">
      <div class="space-y-1">
        <span class="text-[10px] font-mono font-bold uppercase tracking-widest text-white/40">
          Curriculum Drawer
        </span>
        <h3 class="text-sm font-bold text-white uppercase tracking-wider">Unlocking Syllabus</h3>
      </div>
      <button 
        (click)="navService.closeCurriculum()"
        class="p-1.5 rounded-lg bg-white/5 border border-white/10 text-white/40 hover:text-white hover:bg-white/10 transition-colors cursor-pointer"
      >
        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Search / Filter Input Bar -->
    <div class="p-4 border-b border-white/5 bg-black/20">
      <div class="relative">
        <input 
          type="text" 
          placeholder="Filter modules & topics..."
          [(ngModel)]="searchQuery"
          class="w-full bg-black/60 border border-white/10 rounded-xl py-2 pl-9 pr-4 text-xs text-white placeholder-white/30 focus:outline-none focus:border-[#10E39B]/50 transition-all"
        />
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-white/30" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </div>
    </div>

    <!-- Scrollable Modules & Topics List -->
    <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#0b0c10]">
      <div 
        *ngFor="let mod of filteredModulesList"
        class="border border-white/5 rounded-xl overflow-hidden bg-white/2"
      >
        <!-- Module Header Row -->
        <div 
          (click)="toggleModule(mod.slug)"
          class="px-4 py-3 flex items-center justify-between cursor-pointer hover:bg-white/5 transition-colors select-none"
        >
          <div class="flex items-center gap-2.5">
            <!-- Icon/Color badge -->
            <span class="w-1.5 h-1.5 rounded-full" [style.backgroundColor]="getModuleColor(mod.slug)"></span>
            <span class="text-xs font-bold text-white tracking-wide">
              {{ mod.title }}
            </span>
          </div>
          
          <div class="flex items-center gap-2 flex-shrink-0">
            <span class="text-[9px] font-mono text-white/30 bg-white/5 px-1.5 py-0.5 rounded">
              {{ mod.topics.length }}
            </span>
            <svg 
              class="w-3.5 h-3.5 text-white/30 transition-transform duration-200"
              [class.rotate-180]="expandedModules[mod.slug]"
              xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
            >
              <path d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>

        <!-- Module Sub-topics list -->
        <div class="border-t border-white/5 bg-black/40 p-2 space-y-1" *ngIf="expandedModules[mod.slug]">
          <a 
            *ngFor="let t of mod.topics"
            [routerLink]="['/topic', t.slug]"
            (click)="navService.closeCurriculum()"
            class="w-full flex items-center justify-between px-3 py-1.5 rounded-lg text-xs hover:bg-white/5 transition-colors group"
          >
            <div class="flex items-center gap-2 min-w-0 pr-2">
              <!-- Checked indicator -->
              <span 
                [class]="progressService.isTopicVisited(t.slug) ? 'w-1.5 h-1.5 rounded-full bg-emerald-400' : 'w-1.5 h-1.5 rounded-full bg-white/10 group-hover:bg-white/30'"
              ></span>
              <span class="truncate text-white/60 group-hover:text-white">
                {{ t.title }}
              </span>
            </div>
            
            <svg 
              class="w-3 h-3 text-white/20 group-hover:text-[#10E39B] group-hover:translate-x-0.5 transition-all flex-shrink-0"
              xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
            >
              <path d="M9 5l7 7-7 7"/>
            </svg>
          </a>

          <div *ngIf="mod.topics.length === 0" class="text-center py-4 text-[10px] text-white/30 font-mono">
            No topics matched filter.
          </div>
        </div>

      </div>

      <div *ngIf="filteredModulesList.length === 0" class="text-center py-20 text-xs text-white/30 font-mono">
        No modules match your query.
      </div>
    </div>

  </aside>
</div>
